<script type="module">
import * as THREE from 'three';

const Q = new URLSearchParams(location.search);
const FRAME = +(Q.get('f')||1);
const W=1280,H=720,PXS=2,LW=W/PXS,LH=H/PXS;
const C = {ink:0x111111, body:0x1d1b24, paper:0xeeeeee, paperW:0xf6f3ea, signal:0xccff00, meadow:0xb9d984, meadowD:0x9cc56c, meadowL:0xc9e39c,
  pond:0x7db4db, pondL:0xa9d0ea, sun:0xf2ce68, sunL:0xf7e2a0, coral:0xed927e, coralD:0xd67a68, lilac:0xb3a0d8, lilacD:0x8f7bbd, trunk:0x3a3140, stone:0xd9d4c6, tile:0xe6e1d2};
const ui = document.getElementById('ui');
const stage = document.getElementById('stage');
function fit(){ const s=Math.min(innerWidth/W, innerHeight/H); stage.style.transform=`scale(${s})`; }
fit(); addEventListener('resize',fit);

// ---------- seeded rng / noise
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

// ---------- renderer & passes
const canvas=document.getElementById('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H,false);
renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.BasicShadowMap;
function mkRT(depthTex){const rt=new THREE.WebGLRenderTarget(LW,LH,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});
  if(depthTex){rt.depthTexture=new THREE.DepthTexture(LW,LH);rt.depthTexture.type=THREE.UnsignedIntType;} return rt;}
const rtC=mkRT(true), rtN=mkRT(false), rtM=mkRT(false), rtG=mkRT(false);

const shadeMul=new THREE.Vector3(0.55,0.56,0.76);
const lightCol=new THREE.Color(0xfff8e4);
const BAYER=`float bayer2(vec2 a){a=floor(a);return fract(dot(a,vec2(.5,a.y*.75)));}
float bayer4(vec2 a){return bayer2(.5*a)*.25+bayer2(a);}\n`;
function bandMat({color=0xffffff,bevel=false,lightMix=.34,ditherAmp=.12}={}){
  const m=new THREE.MeshLambertMaterial({color});

    sh.uniforms.uShadeMul={value:shadeMul}; sh.uniforms.uLight={value:lightCol};
    sh.vertexShader='varying vec3 vBP;varying vec3 vBN;\n'+(bevel?'attribute vec4 aEdge;varying vec4 vEdge;\n':'')+
      sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvBP=position;vBN=normal;'+(bevel?'vEdge=aEdge;':''));
    sh.fragmentShader='uniform vec3 uShadeMul;uniform vec3 uLight;varying vec3 vBP;varying vec3 vBN;\n'+(bevel?'varying vec4 vEdge;\n':'')+BAYER+
      sh.fragmentShader.replace('#include <opaque_fragment>',`

      float lum=dot(irr,vec3(.3333));
      float bv=0.;
      ${bevel?`if(vBN.z>.5){ if(vEdge.x>.5 && vBP.y>.30) bv=.7; if(vEdge.w>.5 && vBP.x<-.34) bv=max(bv,.5);} if(vBN.y>.5) bv=.05;`:''}
      float t=lum+bv+(bayer4(gl_FragCoord.xy)-.5)*${ditherAmp.toFixed(3)};

const normalMat=new THREE.MeshNormalMaterial();
function flatMat(o){const m=new THREE.MeshBasicMaterial(o);m.onBeforeCompile=sh=>{sh.fragmentShader=sh.fragmentShader.replace('#include <color_fragment>','');};m.customProgramCacheKey=()=>'flat';return m;}
const blackMat=flatMat({color:0}); const whiteMat=flatMat({color:0xffffff});

// ---------- instanced voxel helper
const BOX=new THREE.BoxGeometry(1,1,1);
function voxels(list,mat,{shadow=true,edges=false}={}){
  const geo=edges?BOX.clone():BOX;
  const im=new THREE.InstancedMesh(geo,mat,list.length);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),col=new THREE.Color();
  const ed=edges?new Float32Array(list.length*4):null;
  list.forEach((v,i)=>{m4.compose(new THREE.Vector3(v.x,v.y,v.z),v.q||q,new THREE.Vector3(v.sx,v.sy??v.sx,v.sz??v.sx));im.setMatrixAt(i,m4);im.setColorAt(i,col.set(v.c));if(ed){ed.set(v.e||[0,0,0,0],i*4);}});

// ---------- decal textures (16x16, nearest)
function tex16(draw){const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');draw(g);const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;return t;}
const hex=n=>'#'+n.toString(16).padStart(6,'0');
const TX={
  fresh:tex16(g=>{g.fillStyle='#111';g.fillRect(0,0,16,16);g.fillStyle='#eee';g.fillRect(3,3,10,10);for(let i=0;i<16;i+=4){g.fillStyle='#ccff00';g.fillRect(i,0,2,2);g.fillRect(i+2,14,2,2);g.fillRect(0,i+2,2,2);g.fillRect(14,i,2,2);}}),
  old:tex16(g=>{g.fillStyle='#eeeeee';g.fillRect(0,0,16,16);g.fillStyle='#ED927E';for(let i=0;i<16;i+=4){g.fillRect(i,0,2,2);g.fillRect(i+2,14,2,2);g.fillRect(0,i+2,2,2);g.fillRect(14,i,2,2);}}),
  stitch:tex16(g=>{g.fillStyle=hex(C.coral);for(let i=1;i<15;i++){g.fillRect(i,i,2,2);g.fillRect(15-i-1,i,2,2);}g.fillStyle='#eee';g.fillRect(7,7,2,2);g.fillStyle=hex(C.coral);g.fillRect(0,7,2,2);g.fillRect(14,7,2,2);g.fillRect(7,0,2,2);g.fillRect(7,14,2,2);}),
  crack:tex16(g=>{g.fillStyle='#111';const p=[[2,1],[4,3],[4,5],[7,6],[8,8],[7,10],[10,12],[12,14]];p.forEach(([x,y])=>g.fillRect(x,y,2,2));g.fillRect(8,8,4,1);g.fillRect(11,6,1,3);}),
};
function decal(tx,{alpha=true}={}){return new THREE.MeshBasicMaterial({map:tx,transparent:false,alphaTest:alpha?.5:0});}
const PLANE=new THREE.PlaneGeometry(1,1);

// ---------- Friend builder: canonical 16x16 front sprite extruded (front face only, uniform depth)
function friendRows(id){return FR[id].rows;}
function buildFriend(id,st={},o={}){
  const s=o.s||0.12, dep=(o.depth||1.5)*s, rows=friendRows(id);
  const g=new THREE.Group(); g.userData.isFriend=true; g.userData.id=id;
  let minR=99,maxR=-1,minC=99,maxC=-1;
  for(let r=0;r<16;r++)for(let c=0;c<16;c++)if(rows[r][c]==='#'){minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c);}
  const cx=(minC+maxC)/2;

  const has=(r,c)=>r>=0&&r<16&&c>=0&&c<16&&rows[r][c]==='#';
  const solid=(r,c)=>{if(!has(r,c))return false;const k=st[r+','+c];return !(k==='gone'||k==='fresh'||k==='fly'||k==='sprout');};
  const body=[],gold=[],decals=[],glow=[],fly=[];
  for(let r=0;r<16;r++)for(let c=0;c<16;c++){ if(!has(r,c))continue; const k=st[r+','+c]; const p=pos(r,c);
    const e=[solid(r-1,c)?0:1,solid(r,c+1)?0:1,solid(r+1,c)?0:1,solid(r,c-1)?0:1];
    if(k==='fly'){fly.push({r,c,p});continue;}
    if(k==='gone'||k==='fresh'||k==='sprout'){decals.push({p,tx:k==='fresh'?TX.fresh:TX.old,z:-dep/2+0.004,alpha:false});
      if(k==='sprout') body.push({x:p.x,y:p.y-s*.12,z:-dep/2+s*.35,sx:s*.5,sy:s*.5,sz:s*.5,c:C.body,e:[1,1,1,1]});
      continue;}
    if(k==='gold'||k==='crack'){gold.push({x:p.x,y:p.y,z:0,sx:s,sy:s,sz:dep,c:0xe8b530,e}); if(k==='crack')decals.push({p,tx:TX.crack,z:dep/2+0.003}); continue;}
    body.push({x:p.x,y:p.y,z:0,sx:s,sy:s,sz:dep,c:C.body,e});
    if(k==='mend')decals.push({p,tx:TX.stitch,z:dep/2+0.003});
  }

  const out=new Set(); const stack=[]; for(let i=0;i<16;i++){stack.push([0,i],[15,i],[i,0],[i,15]);}
  while(stack.length){const [r,c]=stack.pop(); if(r<0||r>15||c<0||c>15)continue; const key=r+','+c; if(out.has(key)||has(r,c))continue; out.add(key); stack.push([r+1,c],[r-1,c],[r,c+1],[r,c-1]);}
  const seen=new Set();
  for(let r=0;r<16;r++)for(let c=0;c<16;c++){ const k0=r+','+c; if(has(r,c)||out.has(k0)||seen.has(k0))continue; const comp=[];const st2=[[r,c]];
    while(st2.length){const [a,b]=st2.pop();const k=a+','+b;if(a<0||a>15||b<0||b>15||seen.has(k)||has(a,b)||out.has(k))continue;seen.add(k);comp.push([a,b]);st2.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);}
    if(comp.length<=4) comp.forEach(([a,b])=>glow.push(pos(a,b))); }

  if(gold.length){const m=voxels(gold,MAT.gold,{edges:true}); m.userData.friend=true; m.userData.glow=o.goldGlow??0xf2ce68; g.add(m);}

  const eyeMat=new THREE.MeshBasicMaterial({color:o.eye||0xf3ead0});
  glow.forEach(p=>{const m=new THREE.Mesh(PLANE,eyeMat); m.position.set(p.x,p.y,-dep/2+0.01); m.scale.set(s,s,1); m.userData.friend=true; if(o.eyeGlow)m.userData.glow=o.eyeGlow; g.add(m);});
  g.userData.halo=o.halo||0xf4f2ea; g.userData.fly=fly; g.userData.s=s; g.userData.dep=dep; g.userData.height=(maxR-minR+1)*s; g.userData.pos=pos;

function pixelCube(s,dep,color=C.body){const m=voxels([{x:0,y:0,z:0,sx:s,sy:s,sz:dep,c:color,e:[1,1,1,1]}],MAT.body,{edges:true}); m.userData.friend=true; return m;}

// ---------- creatures: pillowed voxel blobs (volume = not a Friend)
const CPAL={c:C.coral,C:C.coralD,l:C.lilac,L:C.lilacD,y:C.sun,Y:0xd9a444,k:C.ink,w:0xf6f3ea,b:C.pond,B:0x5f95bf,g:C.meadow,p:0xf4a99a};
const CREATURES={
  nib:["...cccccc...","..cccccccc..",".cccccccccc.","ccwwccccwwcc","ccwkccccwkcc","cccccccccccc","cckkkkkkkkcc","ccwkwkkwkwcc",".cccccccccc.","..cc....cc..",".kk......kk."],
  gulp:["yyyyyyyyyyyyy","yywwyyyyywwyy","yywkyyyyywkyy","yyyyyyyyyyyyy","ywywywywywyy.","CCCCCCCCCCCy.","CCCCCppCCCCy.","CCCCppppCCCy.","ywywywywywyy.","yyyyyyyyyyyyy","yyyyyyyyyyyyy",".YY.......YY."],
  snatch:["ll............ll","lll..........lll","llll...LL...llll","lLlll.LLLL.lllLl",".lLllLwkkwLllLl.","..lLlLLccLLlLl..","...llLLccLLll...","......LLLL......",".....L....L....."],
  slurp:["..bbbbb....bbbbb..",".bbwwwbb..bbwwwbb.",".bbwkkbbbbbbwkkbb.","bbbbbbbbbbbbbbbbbb","bbbbbbbbbbbbbbbbbb","bkkkkkkkkkkkkkkkkb","bbbbbbkllllkbbbbbb","bbbbbbbllllbbbbbbb",".BBB..........BBB."],

function buildCreature(name,s=0.12,o={}){

  const dist=[];for(let r=0;r<h;r++){dist[r]=[];for(let c=0;c<w;c++)dist[r][c]=has(r,c)?99:0;}
  for(let it=0;it<6;it++)for(let r=0;r<h;r++)for(let c=0;c<w;c++)if(has(r,c)){const n=Math.min(has(r-1,c)?dist[r-1][c]:0,has(r+1,c)?dist[r+1][c]:0,has(r,c-1)?dist[r][c-1]:0,has(r,c+1)?dist[r][c+1]:0);dist[r][c]=Math.min(dist[r][c],n+1);}

    if('wk'.includes(ch)&&o.faceOnly!==false){ const bodyCol=CPAL[o.skin||'c']; L.push({x,y,z:-s*.5,sx:s,sy:s,sz:depth*s-s,c:bodyCol}); L.push({x,y,z:(depth*s)/2-s/2,sx:s,sy:s,sz:s,c:col}); }
    else L.push({x,y,z:0,sx:s,sy:s,sz:depth*s,c:col});
  }
  const g=new THREE.Group(); const m=voxels(L,MAT.creature); g.add(m); g.userData.h=h*s; g.userData.w=w*s; return g;
}

// ---------- island builder
function buildIsland({R=18,cell=0.24,seed=1,pond=null,plaza=0,squash=1,under=9,topCol=null,cliff=[C.coral,C.coralD],deep=C.lilac,rimDrip=.45,flat=true}={}){
  const L=[]; const cells=new Map(); const N=Math.ceil(R*1.3);

    let top=topCol?topCol(i,j,e):((Math.floor(i/2)+Math.floor(j/2))&1 && vnoise(i*.15,j*.15,seed+3)>.62?C.meadowL:C.meadow);

    if(pond){const pd=Math.hypot((i-pond.i)/pond.r,(j-pond.j)/(pond.r*.7))+(vnoise(i*.4,j*.4,seed+9)-.5)*.3; if(pd<1&&e>1){isPond=true; top=(hash(i,j,5)>.9&&pd<.8)?0xe8f2f6:C.pond; y=-cell*.45;}}

}
function blob(cx,cy,cz,r,cell,col,mat=MAT.soft,{sq=1,seed=1,flatBottom=false}={}){const L=[];const n=Math.ceil(r/cell);

function islandLCD(a,{cx=64,cy=78,rx=54,ry=26,side=10}={}){

  for(let y=-ry;y<=ry+side+14;y++)for(let x=-rx;x<=rx;x++){const inTop=(x*x)/(rx*rx)+(y*y)/(ry*ry)<=1;const yy=y-side;const inSide=(x*x)/(rx*rx)+(Math.max(0,yy)*Math.max(0,yy))/(ry*ry)<=1&&y>0;
    const depth=y-ry;const taper=rx*(1-Math.max(0,y-ry)/(side+14))*1.0;
    if(!inTop&&(inSide||(y>ry&&Math.abs(x)<taper*(1-((x*7+y*3)&7)/40)))){const lvl=y<ry+4?0.5:y<ry+10?0.75:1;const M=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];a.set(cx+x,cy+y,M[(cy+y)&3][(cx+x)&3]<lvl*16?1:0);}
  }
  for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++){const d=(x*x)/(rx*rx)+(y*y)/(ry*ry);if(d<=1){a.set(cx+x,cy+y,0);if(((x+y)&7)===0&&((x-y)&7)===0&&d<.85)a.set(cx+x,cy+y,1);}}
  for(let t=0;t<720;t++){const an=t/720*6.2832;a.set(cx+Math.round(Math.cos(an)*rx),cy+Math.round(Math.sin(an)*ry),1);}
}
