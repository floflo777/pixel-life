<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Life audio lab</title>
    <style>
      :root {
        --ink: #111111;
        --paper: #eeeeee;
        --signal: #ccff00;
        --coral: #ed927e;
        --pond: #7db4db;
        --sun: #f2ce68;
        --lilac: #b3a0d8;
        --meadow: #b9d984;
        --bg: var(--paper);
        --fg: var(--ink);
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: var(--ink);
          --fg: var(--paper);
          --card: #1d1b24;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 ui-monospace,
          "Sometype Mono",
          Menlo,
          Consolas,
          monospace;
        max-width: 1200px;
        margin-inline: auto;
      }
      h1,
      h2 {
        font-weight: 700;
        text-transform: lowercase;
        letter-spacing: 0.02em;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 14px;
        margin: 24px 0 8px;
      }
      p.note {
        margin: 0 0 12px;
        opacity: 0.75;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--fg);
        box-shadow: 4px 4px 0 var(--fg);
        padding: 12px;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
      }
      label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      input[type="range"] {
        width: 120px;
      }
      button {
        min-height: 44px;
        padding: 6px 10px;
        font: inherit;
        color: var(--ink);
        background: var(--paper);
        border: 2px solid var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
        border-radius: 0;
        cursor: pointer;
        text-align: left;
      }
      button:active {
        box-shadow: none;
        transform: translate(2px, 2px);
      }
      button:focus-visible {
        outline: 3px solid var(--pond);
        outline-offset: 2px;
      }
      button.primary {
        background: var(--signal);
      }
      #unlock {
        font-size: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 10px;
      }
      .cue {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
      }
      .cue .name {
        font-weight: 700;
      }
      .cue .label {
        font-size: 11px;
        opacity: 0.75;
      }
      .cue canvas {
        width: 100%;
        height: 28px;
        display: block;
      }
      .group-fling {
        border-left: 6px solid var(--signal);
      }
      .group-creature {
        border-left: 6px solid var(--coral);
      }
      .group-pixel {
        border-left: 6px solid var(--pond);
      }
      .group-run {
        border-left: 6px solid var(--sun);
      }
      .group-gulp {
        border-left: 6px solid var(--lilac);
      }
      .group-meta {
        border-left: 6px solid #e8b530;
      }
      .group-hub {
        border-left: 6px solid var(--meadow);
      }
      .group-ui {
        border-left: 6px solid #999;
      }
      .meters {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 8px;
      }
      .meter {
        border: 2px solid var(--fg);
        height: 70px;
        position: relative;
      }
      .meter .fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--pond);
      }
      .meter .cap {
        position: absolute;
        left: 4px;
        top: 2px;
        font-size: 11px;
        z-index: 1;
      }
      #status {
        font-weight: 700;
      }
      @media (prefers-reduced-motion: reduce) {
        button:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>pixel life · audio lab</h1>
    <p class="note">
      audition every sfx cue and the adaptive music. everything is synthesized in code (no samples). audio starts only
      after you press the button (browsers require a gesture).
    </p>

    <div class="card row">
      <button id="unlock" class="primary" type="button">▶ enable sound</button>
      <span>status: <span id="status">locked</span></span>
      <span>voices: <span id="voices">0</span></span>
      <label><input id="mute" type="checkbox" /> mute (m)</label>
      <label><input id="reduced" type="checkbox" /> reduced audio</label>
      <label>master <input id="vol-master" type="range" min="0" max="1" step="0.01" /></label>
      <label>music <input id="vol-music" type="range" min="0" max="1" step="0.01" /></label>
      <label>sfx <input id="vol-sfx" type="range" min="0" max="1" step="0.01" /></label>
    </div>

    <h2>play parameters</h2>
    <div class="card row">
      <label
        >screen x <input id="p-x" type="range" min="0" max="1" step="0.01" value="0.5" />
        <span id="p-x-v">0.50</span></label
      >
      <label
        >step <input id="p-step" type="range" min="0" max="10" step="1" value="0" /> <span id="p-step-v">0</span></label
      >
      <label
        >gain <input id="p-gain" type="range" min="0" max="1.5" step="0.05" value="1" />
        <span id="p-gain-v">1.00</span></label
      >
      <label><input id="p-auto" type="checkbox" /> auto-increment step (combo demo)</label>
    </div>

    <h2>sequences</h2>
    <div class="card row" id="sequences"></div>

    <h2>music</h2>
    <div class="card">
      <div class="row">
        <label
          >theme
          <select id="m-theme">
            <option value="run">run (112 bpm)</option>
            <option value="hub">hub (84 bpm)</option>
          </select></label
        >
        <label>seed <input id="m-seed" type="text" value="daily-2026-09-30" size="18" /></label>
        <button id="m-play" type="button">play</button>
        <button id="m-stop" type="button">stop</button>
        <button id="m-stop-bar" type="button">stop on bar</button>
        <label><input id="m-gulp" type="checkbox" /> gulp mood</label>
        <span>bar: <span id="m-bar">–</span></span>
      </div>
      <div class="row" style="margin-top: 8px">
        <label
          >intensity <input id="m-int" type="range" min="0" max="1" step="0.01" value="0.3" />
          <span id="m-int-v">0.30</span></label
        >
        <label
          >slow-mo <input id="m-slow" type="range" min="0" max="1" step="0.01" value="0" />
          <span id="m-slow-v">0.00</span></label
        >
        <span id="m-phases" class="row"></span>
      </div>
      <div class="row" style="margin-top: 8px" id="m-stingers"></div>
      <div class="meters" style="margin-top: 12px" id="m-meters"></div>
    </div>

    <h2>cues</h2>
    <div id="cues"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
