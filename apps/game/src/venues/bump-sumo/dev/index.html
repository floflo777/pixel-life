<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Bump Sumo · venue dev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Sometype+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eeeeee;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #wrap {
        position: fixed;
        inset: 0;
      }
      #stage {
        width: 100%;
        height: 100%;
        display: block;
      }
      #dev {
        position: fixed;
        right: 8px;
        bottom: 8px;
        font:
          11px "Sometype Mono",
          monospace;
        background: #111;
        color: #eee;
        padding: 2px 6px;
        z-index: 10;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="stage"></canvas></div>
    <div id="dev"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
