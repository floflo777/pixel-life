<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Home Isle</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eeeeee;
        overflow: hidden;
        font: 12px/1.3 monospace;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        background: #eeeeee;
        border: 2px solid #111111;
        box-shadow: 3px 3px 0 #111111;
        padding: 6px;
      }
      #panel button {
        font: inherit;
        border: 2px solid #111111;
        background: #f6f3ea;
        padding: 4px 6px;
        min-height: 32px;
      }
      #panel button[aria-pressed="true"] {
        background: #111111;
        color: #ccff00;
      }
      #status {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" tabindex="0" aria-label="Home isle"></canvas>
    <div id="panel" role="toolbar" aria-label="Isle editor">
      <div id="status" aria-live="polite"></div>
    </div>
    <script type="module" src="./home-dev.ts"></script>
  </body>
</html>
