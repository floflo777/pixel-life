<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Munchies Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Sometype+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111111;
        --paper: #eeeeee;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .lbl {
        position: absolute;
        transform: translate(-50%, 0);
        padding: 1px 4px;
        background: var(--paper);
        border: 1px solid var(--ink);
        white-space: nowrap;
        font:
          10px/1.2 "Sometype Mono",
          ui-monospace,
          monospace;
        text-transform: lowercase;
      }
      .head {
        font:
          700 11px/1.2 "Silkscreen",
          monospace;
        text-transform: none;
      }
      #title {
        position: fixed;
        left: 12px;
        top: 10px;
        background: var(--ink);
        color: var(--paper);
        font:
          700 12px/1 "Silkscreen",
          monospace;
        padding: 6px 10px 5px;
        box-shadow: 2px 2px 0 var(--ink);
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <div id="title">Loose Pixels · Munchies</div>
    <script type="module" src="./creature-gallery.ts"></script>
  </body>
</html>
