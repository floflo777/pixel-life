<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>The Sky Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Sometype+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111111;
        --paper: #eeeeee;
        --signal: #ccff00;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
        font-family: "Silkscreen", monospace;
      }
      #wrap {
        position: fixed;
        inset: 0;
      }
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .hud {
        position: absolute;
        background: var(--paper);
        color: var(--ink);
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        padding: 8px 10px;
      }
      #you {
        left: 24px;
        top: 24px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      #you canvas {
        width: 48px;
        height: 48px;
        image-rendering: pixelated;
        border: 2px solid var(--ink);
      }
      #you .big {
        font-size: 26px;
        font-weight: 700;
        line-height: 26px;
      }
      #you .big small {
        font-size: 12px;
      }
      .lbl {
        font:
          11px/13px "Sometype Mono",
          monospace;
        text-transform: lowercase;
      }
      #place {
        right: 24px;
        top: 24px;
        text-align: left;
        min-width: 170px;
      }
      #place .big {
        font-size: 22px;
        font-weight: 700;
        margin-top: 6px;
      }
      #place .big small {
        font-size: 11px;
      }
      #bar {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      #bar button {
        font:
          700 14px/14px "Silkscreen",
          monospace;
        min-width: 44px;
        height: 44px;
        background: var(--paper);
        color: var(--ink);
        border: 2px solid var(--ink);
        box-shadow: 2px 2px 0 var(--ink);
        cursor: pointer;
      }
      #bar button:active {
        box-shadow: none;
        transform: translate(2px, 2px);
      }
      #bar button.play {
        background: var(--signal);
        font-size: 20px;
        padding: 0 18px;
        height: 52px;
        margin-left: 14px;
      }
      #mend {
        left: 110px;
        bottom: 22px;
        display: none;
        max-width: 190px;
      }
      #mend .pill {
        background: var(--signal);
        border: 2px solid var(--ink);
        padding: 0 4px;
        font-size: 11px;
      }
      #stats {
        position: fixed;
        left: 8px;
        bottom: 90px;
        background: var(--ink);
        color: var(--signal);
        font:
          11px/14px "Sometype Mono",
          monospace;
        padding: 6px 8px;
        white-space: pre;
        display: none;
      }
      #toast {
        position: absolute;
        left: 50%;
        top: 90px;
        transform: translateX(-50%);
        background: var(--ink);
        color: var(--paper);
        padding: 6px 10px;
        font-size: 12px;
        display: none;
      }
      @media (max-width: 520px) {
        #you {
          left: 8px;
          top: 8px;
          padding: 4px 6px;
        }
        #you canvas {
          width: 32px;
          height: 32px;
        }
        #you .big {
          font-size: 18px;
          line-height: 18px;
        }
        #place {
          right: 8px;
          top: 8px;
          min-width: 0;
          padding: 4px 6px;
        }
        #place .big {
          font-size: 16px;
        }
        #bar {
          bottom: 84px;
          gap: 6px;
        }
        #bar button.play {
          margin-left: 4px;
          padding: 0 10px;
        }
        #mend {
          left: 8px;
          bottom: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="stage" aria-label="The Sky"></canvas>
      <div id="overlay"></div>
      <div class="hud" id="you">
        <canvas id="sil" width="16" height="16"></canvas>
        <div>
          <div class="lbl" id="you-id">#344030</div>
          <div class="big" id="you-px">80/82 <small>PX</small></div>
          <div class="lbl" id="you-heal">1 scar healing · 3h</div>
        </div>
      </div>
      <div class="hud" id="place">
        <div class="lbl" id="place-name">the sky · plaza · 0 friends here</div>
        <div class="big">12.5 <small>RF</small></div>
        <div class="lbl">simulated</div>
      </div>
      <div class="hud" id="mend">
        <div>MEND <span id="mend-id">#0</span> <span class="pill">TAP</span></div>
        <div class="lbl" id="mend-sub">6 px · 6 rf (simulated)</div>
        <div class="lbl">half burned · half to its wallet</div>
      </div>
      <div id="bar">
        <button data-emote="heart" aria-label="heart">♥</button>
        <button data-say="1" aria-label="say gg">GG</button>
        <button data-emote="hop" aria-label="hop">!</button>
        <button data-emote="pixel-burst" aria-label="pixel burst">✦</button>
        <button data-emote="sit" aria-label="sit">ZZ</button>
        <button class="play" id="play">▶ PLAY</button>
      </div>
      <div id="toast"></div>
    </div>
    <div id="stats"></div>
    <script type="module" src="./hub-main.ts"></script>
  </body>
</html>
